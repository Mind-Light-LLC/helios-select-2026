      <path d="M16 60C31 50 63 50 80 60" stroke="#E8BE80" stroke-width="7" stroke-linecap="round"/>
      <path d="M24 69C40 78 61 78 76 69" stroke="#E8BE80" stroke-width="7" stroke-linecap="round"/>
