      <path d="M31 18C24 36 24 60 31 78M65 18C72 36 72 60 65 78M27 48H69" fill="none" stroke="#E8BE80" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="68" cy="48" r="7" fill="#E98756" stroke="#102B3B" stroke-width="3"/>
    </g>
    <circle cx="34" cy="255" r="16" fill="#0B2233"/>
