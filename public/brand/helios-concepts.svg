    <text x="20" y="306" fill="#5C7379" font-family="Arial, sans-serif" font-size="14">The globe and an H share one form.</text>
    <text x="20" y="329" fill="#5C7379" font-family="Arial, sans-serif" font-size="14">A destination sits on the equator.</text>
