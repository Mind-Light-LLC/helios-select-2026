<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Helios logo directions</title>
  <desc id="desc">Three vector marks: Meridian, Horizon, and Passage, each shown on light and dark backgrounds.</desc>
  <rect width="1200" height="520" fill="#F1F0E9"/>
