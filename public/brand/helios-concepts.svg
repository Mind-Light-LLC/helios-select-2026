    <text x="20" y="306" fill="#5C7379" font-family="Arial, sans-serif" font-size="14">Earth, a rising light, and a</text>
    <text x="20" y="329" fill="#5C7379" font-family="Arial, sans-serif" font-size="14">single place to move toward.</text>
  </g>
