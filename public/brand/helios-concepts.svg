  <text x="46" y="75" fill="#5C7379" font-family="Arial, sans-serif" font-size="14">A mark for finding a place in the world, then moving toward it.</text>
  <g transform="translate(42 108)">
    <rect width="352" height="360" rx="22" fill="#FFFFFF" stroke="#C98155" stroke-width="3"/>
    <rect x="14" y="14" width="324" height="215" rx="16" fill="#0B2233"/>
    <g transform="translate(110 45) scale(1.4)">
